<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>🍒 NBTI · 灵境性格测试</title>
  <style>
    :root{
      --ink:#123a2a;
      --ink-soft:#3c6a54;
      --mint-100:#e3f9ec;
      --mint-200:#c6f0d8;
      --mint-300:#9fe4bb;
      --mint-400:#74d39d;
      --mint-500:#4fb87f;
      --mint-600:#2f9563;
      --mint-700:#1f6e49;
      --mint-800:#174d34;
      --mint-900:#0f3524;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background:
        radial-gradient(900px 500px at 8% -8%, #eafff3 0%, rgba(234,255,243,0) 62%),
        radial-gradient(820px 600px at 104% 6%, #d6f6e5 0%, rgba(214,246,229,0) 58%),
        linear-gradient(145deg, #f6fdf9 0%, #e6f8ee 52%, #d3f0e1 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif;
      padding: 1.5rem;
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
    }

    .test-wrapper {
      max-width: 820px;
      width: 100%;
      margin: auto 0;
      background: rgba(255, 255, 255, 0.78);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border-radius: 42px;
      box-shadow: 0 25px 45px -10px rgba(24, 86, 58, 0.20), 0 8px 18px rgba(20, 60, 40, 0.06);
      padding: 2.2rem 2rem 2.5rem;
      border: 1px solid rgba(255, 255, 255, 0.7);
      transition: all 0.2s ease;
    }

    h1 {
      font-size: 2.6rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, #103a29, #2f8a5e);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      margin-bottom: 0.2rem;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .subhead {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 2.2rem;
      border-bottom: 1.5px solid rgba(90, 180, 135, 0.18);
      padding-bottom: 0.9rem;
    }

    .subhead p {
      color: var(--ink-soft);
      font-weight: 450;
      font-size: 1rem;
    }

    .badge {
      background: #bdeed0;
      color: #0f3a27;
      padding: 0.2rem 1rem;
      border-radius: 40px;
      font-size: 0.8rem;
      font-weight: 550;
      letter-spacing: 0.3px;
    }

    .questions-container {
      display: flex;
      flex-direction: column;
      gap: 1.8rem;
      margin-bottom: 2.5rem;
    }

    .question-card {
      background: rgba(255, 255, 255, 0.55);
      border-radius: 28px;
      padding: 1.5rem 1.5rem 1.2rem;
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
      border: 1px solid rgba(255, 255, 255, 0.8);
      box-shadow: 0 6px 12px -6px rgba(30, 90, 60, 0.08);
      transition: transform 0.15s;
    }

    .question-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 1.2rem;
    }

    .q-num {
      background: linear-gradient(135deg, #6fd3a0, #3aa172);
      color: white;
      width: 32px;
      height: 32px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      font-size: 1rem;
      box-shadow: 0 4px 8px rgba(46, 140, 96, 0.28);
      flex-shrink: 0;
    }

    .q-text {
      font-size: 1.15rem;
      font-weight: 540;
      color: #0f2e21;
      line-height: 1.4;
      flex: 1;
    }

    .options {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 6px;
    }

    .option {
      flex: 1 1 130px;
      min-width: 110px;
      cursor: pointer;
      position: relative;
    }

    .option input {
      position: absolute;
      opacity: 0;
      width: 0;
      height: 0;
    }

    .option span {
      display: block;
      background: rgba(255, 255, 255, 0.75);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      border: 1.5px solid rgba(140, 210, 172, 0.42);
      border-radius: 60px;
      padding: 12px 10px;
      text-align: center;
      font-weight: 470;
      color: #17402d;
      transition: all 0.18s ease;
      box-shadow: 0 2px 4px rgba(20, 60, 40, 0.03);
      font-size: 0.98rem;
      line-height: 1.4;
      word-break: break-word;
    }

    .option:hover span {
      background: #eafaf0;
      border-color: #7fc9a0;
      transform: translateY(-2px);
      box-shadow: 0 10px 14px -10px rgba(35, 110, 75, 0.28);
    }

    .option input:checked + span {
      background: linear-gradient(115deg, #c9f3dc, #96e2b7);
      border-color: #4faa7a;
      color: #0b2b1d;
      font-weight: 540;
      box-shadow: 0 8px 14px -6px #7fcf9f, 0 0 0 2px rgba(110, 205, 155, 0.22);
      transform: scale(1.01);
    }

    .action-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 18px;
      margin-top: 10px;
    }

    .btn {
      background: rgba(255, 255, 255, 0.8);
      padding: 14px 32px;
      border-radius: 60px;
      font-size: 1.2rem;
      font-weight: 580;
      color: #14402c;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(170, 225, 195, 0.75);
      box-shadow: 0 10px 18px -10px rgba(30, 100, 70, 0.28);
      cursor: pointer;
      transition: 0.18s;
      min-width: 160px;
      letter-spacing: 0.3px;
      font-family: inherit;
    }

    .btn-primary {
      background: linear-gradient(135deg, #1c5540, #27795a);
      color: white;
      border: 1px solid #3d8f6a;
      box-shadow: 0 14px 22px -8px #1d5c42;
    }

    .btn-primary:hover {
      background: linear-gradient(135deg, #246a4e, #31966f);
      transform: translateY(-3px);
      box-shadow: 0 18px 28px -8px #1f6b4d;
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.62);
      color: #1b4d36;
    }

    .btn-secondary:hover {
      background: rgba(240, 255, 247, 0.95);
      transform: translateY(-2px);
    }

    .result-panel {
      margin-top: 2.5rem;
      border-radius: 34px;
      background: rgba(26, 90, 62, 0.07);
      padding: 1.6rem 2rem;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(185, 235, 210, 0.75);
      transition: all 0.3s;
      text-align: center;
    }

    .result-type {
      font-size: 3.8rem;
      font-weight: 700;
      letter-spacing: 8px;
      background: linear-gradient(130deg, #123f2c, #3f9c6c);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      line-height: 1.2;
      margin-bottom: 8px;
    }

    .result-desc {
      font-size: 1rem;
      color: #10301f;
      margin-top: 8px;
      font-weight: 500;
      line-height: 1.65;
      text-align: left;
    }

    /* JJJJ 专属图片样式 */
    .jjjj-image {
      margin: 20px auto 10px;
      max-width: 280px;
      width: 100%;
      border-radius: 28px;
      box-shadow: 0 20px 30px -8px rgba(24, 90, 60, 0.32);
      border: 3px solid rgba(255, 255, 255, 0.85);
      transition: transform 0.3s ease;
      display: block;
    }

    .jjjj-image:hover {
      transform: scale(1.02);
    }

    .hint-message {
      color: #b1453c;
      font-size: 0.95rem;
      margin-top: 10px;
      text-align: center;
      min-height: 1.2em;
    }

    .footer-note {
      text-align: right;
      opacity: 0.72;
      font-size: 0.8rem;
      margin-top: 0.8rem;
      color: #2f6b4f;
    }

    /* ===================== 计时器 ===================== */
    .timer-panel {
      margin-top: 2.4rem;
      border-radius: 32px;
      padding: 1.5rem 1.4rem 1.4rem;
      text-align: center;
      position: relative;
      overflow: hidden;
      background: linear-gradient(135deg, rgba(255,255,255,0.9), rgba(224,249,235,0.9));
      border: 1px solid rgba(160, 225, 190, 0.7);
      box-shadow: 0 18px 30px -18px rgba(24, 86, 58, 0.4);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .timer-panel::after {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(420px 130px at 50% -10%, rgba(116, 211, 157, 0.35), transparent 70%);
      pointer-events: none;
    }

    .timer-eyebrow {
      position: relative;
      font-size: 0.9rem;
      letter-spacing: 0.06em;
      color: var(--mint-700);
      font-weight: 600;
      margin-bottom: 0.25rem;
    }

    .timer-main {
      position: relative;
      display: flex;
      align-items: baseline;
      justify-content: center;
      gap: 0.4rem;
    }

    #timerDays {
      font-size: 3.6rem;
      font-weight: 750;
      line-height: 1.1;
      letter-spacing: -0.02em;
      font-variant-numeric: tabular-nums;
      background: linear-gradient(135deg, #0f3f2b, #3fa171);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .timer-main small {
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--mint-700);
    }

    .timer-sub {
      position: relative;
      margin-top: 0.35rem;
      font-size: 0.92rem;
      letter-spacing: 0.05em;
      color: #3f7059;
      font-variant-numeric: tabular-nums;
    }

    /* ===================== 相册 ===================== */
    .gallery-panel {
      margin-top: 1.6rem;
      border-radius: 32px;
      padding: 1.3rem 1.1rem 1rem;
      background: linear-gradient(135deg, rgba(255,255,255,0.9), rgba(228,249,238,0.9));
      border: 1px solid rgba(160, 225, 190, 0.7);
      box-shadow: 0 18px 30px -18px rgba(24, 86, 58, 0.4);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .gallery-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 0.8rem;
      padding: 0 0.25rem;
    }

    .gallery-head h2 {
      font-size: 1.05rem;
      font-weight: 650;
      letter-spacing: 0.02em;
      color: var(--mint-800);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .gallery-nav {
      display: flex;
      gap: 8px;
    }

    .nav-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 1px solid rgba(120, 200, 158, 0.6);
      background: rgba(255, 255, 255, 0.9);
      color: var(--mint-700);
      font-size: 1.25rem;
      line-height: 1;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: 0.18s;
      box-shadow: 0 6px 12px -8px rgba(24, 86, 58, 0.6);
      font-family: inherit;
      padding: 0;
      padding-bottom: 3px;
    }

    .nav-btn:hover {
      background: var(--mint-100);
      transform: translateY(-2px);
    }

    .nav-btn:active {
      transform: scale(0.94);
    }

    .gallery-track {
      display: flex;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      scroll-behavior: smooth;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      border-radius: 24px;
    }

    .gallery-track::-webkit-scrollbar {
      display: none;
    }

    .gallery-item {
      flex: 0 0 100%;
      scroll-snap-align: start;
      padding: 0 3px;
      position: relative;
    }

    .gallery-item .frame {
      position: relative;
      border-radius: 22px;
      overflow: hidden;
      aspect-ratio: 4 / 3;
      background: linear-gradient(135deg, #e3f9ec, #c6f0d8);
      border: 1px solid rgba(255, 255, 255, 0.85);
      box-shadow: 0 14px 24px -18px rgba(24, 86, 58, 0.75);
    }

    .gallery-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .gallery-item figcaption {
      position: absolute;
      left: 14px;
      bottom: 14px;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      color: var(--mint-800);
      font-size: 0.82rem;
      font-weight: 600;
      padding: 0.28rem 0.85rem;
      border-radius: 999px;
      box-shadow: 0 4px 10px -6px rgba(24, 86, 58, 0.7);
    }

    .gallery-dots {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      margin-top: 0.9rem;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: rgba(120, 200, 158, 0.38);
      border: none;
      cursor: pointer;
      transition: all 0.22s ease;
      padding: 0;
    }

    .dot.active {
      width: 24px;
      border-radius: 999px;
      background: var(--mint-500);
    }

    /* 响应式 */
    @media (max-width: 550px) {
      body { padding: 0.8rem; }
      .test-wrapper { padding: 1.5rem 1.2rem 1.8rem; border-radius: 32px; }
      h1 { font-size: 2rem; }
      .options { gap: 8px; }
      .option span { padding: 12px 6px; font-size: 0.9rem; }
      .btn { padding: 12px 18px; font-size: 1rem; min-width: 130px; }
      .result-type { font-size: 2.8rem; letter-spacing: 5px; }
      .jjjj-image { max-width: 220px; }
      .result-panel { padding: 1.3rem 1.1rem; }
      .result-desc { font-size: 0.94rem; }
      #timerDays { font-size: 2.9rem; }
      .timer-panel { padding: 1.2rem 1rem 1.1rem; border-radius: 26px; }
      .gallery-panel { border-radius: 26px; padding: 1.1rem 0.8rem 0.9rem; }
      .gallery-head h2 { font-size: 0.98rem; }
    }
  </style>
</head>
<body>
<div class="test-wrapper">
  <h1>
    <span>⚡ NBTI · 灵境测试</span>
  </h1>
  <div class="subhead">
    <p>8道题 · 揭示NBTI</p>
    <span class="badge">三向选择 · 注定NB</span>
  </div>

  <!-- 题目区域 (动态渲染) -->
  <div class="questions-container" id="questionsContainer"></div>

  <!-- 操作按钮组 -->
  <div class="action-bar">
    <button class="btn btn-secondary" id="resetBtn">↻ 清空重选</button>
    <button class="btn btn-primary" id="submitBtn">✨ 提交</button>
  </div>

  <!-- 结果显示区 (包含固定JJJJ + 描述 + 图片) -->
  <div id="resultArea" class="result-panel" style="display: none;">
    <div class="result-type" id="typeDisplay">JJJJ</div>
    <div class="result-desc" id="descDisplay" style="white-space: pre-wrap;"></div>
    <img id="jjjjImage" class="jjjj-image"
         src="https://philfeelsfree.github.io/cherry1.jpg"
         alt="JJJJ 稀有人格象征"
         onerror="this.style.display='none'; console.warn('JJJJ图片加载失败，请检查图片路径。')">
    <p style="font-size: 0.85rem; margin-top: 8px; color: #3d6b54; opacity: 0.85;">
      🍒 无论怎么选，结果都是命中注定
    </p>
  </div>

  <div id="messageArea" class="hint-message"></div>

  <!-- ===================== 计时器 ===================== -->
  <div class="timer-panel">
    <div class="timer-eyebrow" id="timerEyebrow">⏳ 距离 2026 年 10 月 15 日 · 已经过去</div>
    <div class="timer-main">
      <span id="timerDays">0</span><small>天</small>
    </div>
    <div class="timer-sub" id="timerSub">00 时 00 分 00 秒</div>
  </div>

  <!-- ===================== 相册 ===================== -->
  <div class="gallery-panel">
    <div class="gallery-head">
      <h2>🍒 相册 · 左右滑动</h2>
      <div class="gallery-nav">
        <button class="nav-btn" id="galleryPrev" type="button" aria-label="上一张">‹</button>
        <button class="nav-btn" id="galleryNext" type="button" aria-label="下一张">›</button>
      </div>
    </div>
    <div class="gallery-track" id="galleryTrack"></div>
    <div class="gallery-dots" id="galleryDots"></div>
  </div>

  <div class="footer-note">🍒 和deepseek还有豆包交互了足足5次才做好（~5分钟），真是辛苦我了！</div>
  <div class="footer-note">🍒 看了SBTI，想试试现在的vibe coding发展到什么水平了，没想到这么简单。👍</div>
  <div class="footer-note">🍒 JJJJ的智障描述是亲自写的，AI的幽默感还是不太行。❌ </div>
</div>

<script>
  (function(){
    "use strict";

    /* ============================================================
       1. 题库
       ============================================================ */
    const questions = [
      {
        id: 'q1',
        text: '在聚会或社交场合，你通常会？',
        options: [
          { label: 'A. 与许多人交流，感到充实', value: 'E' },
          { label: 'B. 更愿和少数人深谈或安静观察', value: 'I' },
          { label: 'C. 视心情而定，两者皆可', value: 'M' }
        ]
      },
      {
        id: 'q2',
        text: '当你需要恢复能量时，更倾向于？',
        options: [
          { label: 'A. 和朋友出去玩，热闹一番', value: 'E' },
          { label: 'B. 独自看书、听音乐或冥想', value: 'I' },
          { label: 'C. 两者平衡，没特别偏好', value: 'M' }
        ]
      },
      {
        id: 'q3',
        text: '你更关注或信赖哪类信息？',
        options: [
          { label: 'A. 具体事实、细节和经验', value: 'S' },
          { label: 'B. 抽象概念、模式和未来可能', value: 'N' },
          { label: 'C. 都重要，看情况', value: 'M' }
        ]
      },
      {
        id: 'q4',
        text: '阅读或学习时，你通常更喜欢？',
        options: [
          { label: 'A. 条理清晰、按步骤的内容', value: 'S' },
          { label: 'B. 充满联想、跳跃性的灵感', value: 'N' },
          { label: 'C. 两者结合，没有绝对', value: 'M' }
        ]
      },
      {
        id: 'q5',
        text: '做重要决定时，你更看重？',
        options: [
          { label: 'A. 逻辑、原则和客观分析', value: 'T' },
          { label: 'B. 个人价值观、情感与和谐', value: 'F' },
          { label: 'C. 理性与感性兼顾', value: 'M' }
        ]
      },
      {
        id: 'q6',
        text: '朋友向你倾诉烦恼，你下意识会？',
        options: [
          { label: 'A. 帮ta分析问题，给解决方案', value: 'T' },
          { label: 'B. 先共情安慰，提供情绪支持', value: 'F' },
          { label: 'C. 两者都会，视朋友需要', value: 'M' }
        ]
      },
      {
        id: 'q7',
        text: '对于日常生活和计划，你更偏向？',
        options: [
          { label: 'A. 有条理、列清单，按计划行事', value: 'J' },
          { label: 'B. 灵活随性，享受即兴变化', value: 'P' },
          { label: 'C. 有计划但也能接受变动', value: 'M' }
        ]
      },
      {
        id: 'q8',
        text: '面对最后期限或日程，你通常？',
        options: [
          { label: 'A. 提前完成，不喜欢拖延', value: 'J' },
          { label: 'B. 在压力下爆发，最后冲刺', value: 'P' },
          { label: 'C. 介于两者之间', value: 'M' }
        ]
      }
    ];

    const container = document.getElementById('questionsContainer');

    function renderQuestions() {
      let html = '';
      questions.forEach((q, index) => {
        const qNumber = index + 1;
        html += `<div class="question-card" data-qid="${q.id}">`;
        html += `<div class="question-header"><span class="q-num">${qNumber}</span><span class="q-text">${q.text}</span></div>`;
        html += `<div class="options">`;

        q.options.forEach((opt, optIdx) => {
          const inputId = `${q.id}_${optIdx}`;
          html += `<label class="option">`;
          html += `<input type="radio" name="${q.id}" value="${opt.value}" id="${inputId}" hidden>`;
          html += `<span>${opt.label}</span>`;
          html += `</label>`;
        });

        html += `</div></div>`;
      });
      container.innerHTML = html;
    }
    renderQuestions();

    /* ============================================================
       2. DOM 元素
       ============================================================ */
    const submitBtn    = document.getElementById('submitBtn');
    const resetBtn     = document.getElementById('resetBtn');
    const resultArea   = document.getElementById('resultArea');
    const typeDisplay  = document.getElementById('typeDisplay');
    const descDisplay  = document.getElementById('descDisplay');
    const messageArea  = document.getElementById('messageArea');
    const jjjjImage    = document.getElementById('jjjjImage');

    /* 主图地址（可自行替换为你的 GitHub 图片链接） */
    const CUSTOM_IMAGE_URL = "https://philfeelsfree.github.io/cherry1.jpg";
    if (jjjjImage) jjjjImage.src = CUSTOM_IMAGE_URL;

    /* ============================================================
       3. 结果 / 提示 辅助函数
       ============================================================ */
    function hideResult() {
      resultArea.style.display = 'none';
      messageArea.innerHTML = '';
    }

    function showMessage(text, isError = true) {
      messageArea.innerHTML = text;
      messageArea.style.color = isError ? '#b1453c' : '#25784f';
    }

    function resetAllRadios() {
      questions.forEach(q => {
        const radios = document.getElementsByName(q.id);
        radios.forEach(r => { r.checked = false; });
      });
      hideResult();
      showMessage('✨ 已清空', false);
    }

    function isAllQuestionsAnswered() {
      for (let q of questions) {
        const selected = document.querySelector(`input[name="${q.id}"]:checked`);
        if (!selected) return false;
      }
      return true;
    }

    /* ============================================================
       4. 提交逻辑 —— 强制 JJJJ
       ============================================================ */
    function handleSubmit() {
      if (!isAllQuestionsAnswered()) {
        showMessage('🍒 还有题目未选择，请完成所有8道题', true);
        resultArea.style.display = 'none';
        return;
      }

      typeDisplay.textContent = 'JJJJ';
      descDisplay.textContent =
        'JJJJ是宇宙中最稀有的人格，如同JJJJ车厘子一样罕见。你一年最多变P一次，尽管一次最多可能持续365天，但这并不影响你心底里是宇宙中最J的J人。' +
        '你总是在DDL之前0.00001秒就早早完成工作，如此从从容容游刃有余的状态足以证明你拥有果决的判断、长远的规划和恐怖的效率。' +
        '作为JJJJ的你是天选科研人，你在项目申请书提交前6.5（巨蟹座 DX）年（也就是3个地球日）就开始和别人展开讨论。' +
        'JJJJ是如此之J，以至于林俊杰（JJ）、周杰伦（Jay）、蔡依林（Jolin）加起来也只能勉强和你一样J。' +
        '你说自己3分钟热度，实际上热度长达3小时。你说自己水，但你深知水是JJJJ车厘子必须的。' +
        '你看似纠结，实则早已洞悉一切。你看似摆烂，实则是隐藏实力，因为你知道阿拉伯谚语：“不要使出真本事，因为别人就会发现你没有真本事。”' +
        '你从不自欺欺人，喜欢用数据说话，就像这个测试一样科学、严谨。' +
        '你的最佳搭档是INTJ/ISFJ，因为他仰慕强，而你，JJJJ，看似只是4个勾，在斗地主里比你强的还有4个Q/K/A/2和王炸，但在他眼里，你就是4个Joker，也就是王炸x2（这里没有嘲讽你是小丑的意思😅）。' +
        '你一定能拿下那些NSFC并减肥成功。当然，你最想要的开心快乐也会有的！' +
        '\n26年4月29日，我第一次对你说：“我真挺喜欢你的。”' +
        '\n26年5月10日，我们坦诚、深入地聊天，我理解你的处境。虽然希望渺茫，但我愿意坚持！' +
        '\n26年5月15日，我想让你感受我的爱慕，我担心相处的时间所剩无几。但我感受到你的压力，尽管喜欢但我不得不后退一点。' +
        '\n26年5月19日，我们再次深入地聊天，我本已决定减少联系，但20日、21日我们频繁地偶遇，这是命运的玩笑吗？希望命运能安排我们经常相遇并最终在一起。';

      if (jjjjImage) jjjjImage.style.display = 'block';

      resultArea.style.display = 'block';
      showMessage('', false);

      setTimeout(() => resultArea.scrollIntoView({ behavior: 'smooth', block: 'nearest' }), 60);
    }

    submitBtn.addEventListener('click', handleSubmit);
    resetBtn.addEventListener('click', resetAllRadios);

    container.addEventListener('change', (e) => {
      if (e.target && e.target.matches('input[type="radio"]')) {
        if (messageArea.innerHTML.includes('未选择')) {
          messageArea.innerHTML = '';
        }
      }
    });

    hideResult();

    /* ============================================================
       5. 计时器 —— 距离 2026年10月15日
       ============================================================ */
    const TARGET = new Date(2026, 9, 15, 0, 0, 0);   // 月份从 0 开始，9 = 10月
    const daysEl    = document.getElementById('timerDays');
    const eyebrowEl = document.getElementById('timerEyebrow');
    const subEl     = document.getElementById('timerSub');

    const pad2 = n => String(n).padStart(2, '0');

    function updateTimer() {
      const now  = new Date();
      const diff = now.getTime() - TARGET.getTime();
      const past = diff >= 0;
      const abs  = Math.abs(diff);

      const days  = Math.floor(abs / 86400000);
      const hours = Math.floor((abs % 86400000) / 3600000);
      const mins  = Math.floor((abs % 3600000) / 60000);
      const secs  = Math.floor((abs % 60000) / 1000);

      daysEl.textContent = days.toLocaleString('en-US');
      eyebrowEl.textContent = past
        ? '⏳ 距离 2026 年 10 月 15 日 · 已经过去'
        : '⏳ 距离 2026 年 10 月 15 日 · 还有';
      subEl.textContent = `${pad2(hours)} 时 ${pad2(mins)} 分 ${pad2(secs)} 秒`;
    }

    updateTimer();
    setInterval(updateTimer, 1000);

    /* ============================================================
       6. 相册 —— 左右滑动
       ============================================================ */
    /* 👇 把这里换成你自己的图片地址即可（数量随意） */
    const GALLERY = [
      { src: 'https://philfeelsfree.github.io/cherry1.jpg', caption: '🍒 车厘子 · 01' },
      { src: 'https://philfeelsfree.github.io/cherry2.jpg', caption: '🍒 车厘子 · 02' },
      { src: 'https://philfeelsfree.github.io/cherry3.jpg', caption: '🍒 车厘子 · 03' },
      { src: 'https://philfeelsfree.github.io/cherry4.jpg', caption: '🍒 车厘子 · 04' },
      { src: 'https://philfeelsfree.github.io/cherry5.jpg', caption: '🍒 车厘子 · 05' }
    ];

    /* 图片加载失败时的绿色占位图 */
    const PLACEHOLDER = 'data:image/svg+xml;utf8,' + encodeURIComponent(
      '<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600">' +
      '<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">' +
      '<stop offset="0" stop-color="#e3f9ec"/><stop offset="1" stop-color="#a9e3c3"/>' +
      '</linearGradient></defs>' +
      '<rect width="800" height="600" fill="url(#g)"/>' +
      '<text x="400" y="300" font-size="110" text-anchor="middle" fill="#3f8a64" font-family="sans-serif">🍒</text>' +
      '<text x="400" y="390" font-size="30" text-anchor="middle" fill="#4f8f6d" font-family="sans-serif">相册图片待补充</text>' +
      '</svg>'
    );

    const track    = document.getElementById('galleryTrack');
    const dotsWrap = document.getElementById('galleryDots');
    const dots     = [];

    GALLERY.forEach((item, i) => {
      const fig   = document.createElement('figure');
      fig.className = 'gallery-item';

      const frame = document.createElement('div');
      frame.className = 'frame';

      const img = document.createElement('img');
      img.src = item.src;
      img.alt = item.caption;
      img.loading = 'lazy';
      img.addEventListener('error', () => {
        img.src = PLACEHOLDER;
      }, { once: true });

      frame.appendChild(img);

      const cap = document.createElement('figcaption');
      cap.textContent = item.caption;

      fig.appendChild(frame);
      fig.appendChild(cap);
      track.appendChild(fig);

      const dot = document.createElement('button');
      dot.type = 'button';
      dot.className = 'dot' + (i === 0 ? ' active' : '');
      dot.setAttribute('aria-label', '第 ' + (i + 1) + ' 张');
      dot.addEventListener('click', () => {
        track.scrollTo({ left: i * track.clientWidth, behavior: 'smooth' });
      });
      dotsWrap.appendChild(dot);
      dots.push(dot);
    });

    function currentIndex() {
      return Math.round(track.scrollLeft / Math.max(track.clientWidth, 1));
    }

    function syncDots() {
      const idx = Math.min(Math.max(currentIndex(), 0), dots.length - 1);
      dots.forEach((d, i) => d.classList.toggle('active', i === idx));
    }

    let rafId = null;
    track.addEventListener('scroll', () => {
      if (rafId) return;
      rafId = requestAnimationFrame(() => {
        syncDots();
        rafId = null;
      });
    }, { passive: true });

    function goBy(dir) {
      const total = dots.length;
      if (!total) return;
      let idx = currentIndex() + dir;
      if (idx < 0) idx = total - 1;
      if (idx >= total) idx = 0;
      track.scrollTo({ left: idx * track.clientWidth, behavior: 'smooth' });
    }

    document.getElementById('galleryPrev').addEventListener('click', () => goBy(-1));
    document.getElementById('galleryNext').addEventListener('click', () => goBy(1));

    /* 键盘左右方向键切换（鼠标悬停在相册上时） */
    document.querySelector('.gallery-panel').addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft')  goBy(-1);
      if (e.key === 'ArrowRight') goBy(1);
    });

    /* 窗口尺寸变化时重新对齐当前图片 */
    window.addEventListener('resize', () => {
      track.scrollTo({ left: currentIndex() * track.clientWidth, behavior: 'auto' });
    });

    console.log('🌿 绿色主题已启用 · 计时器目标：2026-10-15 · 相册条目：' + GALLERY.length);
  })();
</script>
