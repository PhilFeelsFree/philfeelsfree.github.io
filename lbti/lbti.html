<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>🌿 LBTI · 灵型性格测试</title>
  <style>
    :root{
      --ink:#123a2a;
      --ink-soft:#3c6a54;
      --mint-100:#e3f9ec;
      --mint-200:#c6f0d8;
      --mint-300:#9fe4bb;
      --mint-400:#74d39d;
      --mint-500:#4fb87f;
      --mint-600:#2f9563;
      --mint-700:#1f6e49;
      --mint-800:#174d34;
      --mint-900:#0f3524;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background:
        radial-gradient(900px 500px at 8% -8%, #eafff3 0%, rgba(234,255,243,0) 62%),
        radial-gradient(820px 600px at 104% 6%, #d6f6e5 0%, rgba(214,246,229,0) 58%),
        linear-gradient(145deg, #f6fdf9 0%, #e6f8ee 52%, #d3f0e1 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif;
      padding: 1.5rem;
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
    }

    .test-wrapper {
      max-width: 820px;
      width: 100%;
      margin: auto 0;
      background: rgba(255, 255, 255, 0.78);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border-radius: 42px;
      box-shadow: 0 25px 45px -10px rgba(24, 86, 58, 0.20), 0 8px 18px rgba(20, 60, 40, 0.06);
      padding: 2.2rem 2rem 2.5rem;
      border: 1px solid rgba(255, 255, 255, 0.7);
      transition: all 0.2s ease;
    }

    h1 {
      font-size: 2.6rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, #103a29, #2f8a5e);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      margin-bottom: 0.2rem;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .subhead {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 2.2rem;
      border-bottom: 1.5px solid rgba(90, 180, 135, 0.18);
      padding-bottom: 0.9rem;
    }

    .subhead p {
      color: var(--ink-soft);
      font-weight: 450;
      font-size: 1rem;
    }

    .badge {
      background: #bdeed0;
      color: #0f3a27;
      padding: 0.2rem 1rem;
      border-radius: 40px;
      font-size: 0.8rem;
      font-weight: 550;
      letter-spacing: 0.3px;
    }

    .questions-container {
      display: flex;
      flex-direction: column;
      gap: 1.8rem;
      margin-bottom: 2.5rem;
    }

    .question-card {
      background: rgba(255, 255, 255, 0.55);
      border-radius: 28px;
      padding: 1.5rem 1.5rem 1.2rem;
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
      border: 1px solid rgba(255, 255, 255, 0.8);
      box-shadow: 0 6px 12px -6px rgba(30, 90, 60, 0.08);
      transition: transform 0.15s;
    }

    .question-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 1.2rem;
    }

    .q-num {
      background: linear-gradient(135deg, #6fd3a0, #3aa172);
      color: white;
      width: 32px;
      height: 32px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      font-size: 1rem;
      box-shadow: 0 4px 8px rgba(46, 140, 96, 0.28);
      flex-shrink: 0;
    }

    .q-text {
      font-size: 1.15rem;
      font-weight: 540;
      color: #0f2e21;
      line-height: 1.4;
      flex: 1;
    }

    .options {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 6px;
    }

    .option {
      flex: 1 1 130px;
      min-width: 110px;
      cursor: pointer;
      position: relative;
    }

    .option input {
      position: absolute;
      opacity: 0;
      width: 0;
      height: 0;
    }

    .option span {
      display: block;
      background: rgba(255, 255, 255, 0.75);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      border: 1.5px solid rgba(140, 210, 172, 0.42);
      border-radius: 60px;
      padding: 12px 10px;
      text-align: center;
      font-weight: 470;
      color: #17402d;
      transition: all 0.18s ease;
      box-shadow: 0 2px 4px rgba(20, 60, 40, 0.03);
      font-size: 0.98rem;
      line-height: 1.4;
      word-break: break-word;
    }

    .option:hover span {
      background: #eafaf0;
      border-color: #7fc9a0;
      transform: translateY(-2px);
      box-shadow: 0 10px 14px -10px rgba(35, 110, 75, 0.28);
    }

    .option input:checked + span {
      background: linear-gradient(115deg, #c9f3dc, #96e2b7);
      border-color: #4faa7a;
      color: #0b2b1d;
      font-weight: 540;
      box-shadow: 0 8px 14px -6px #7fcf9f, 0 0 0 2px rgba(110, 205, 155, 0.22);
      transform: scale(1.01);
    }

    .action-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 18px;
      margin-top: 10px;
    }

    .btn {
      background: rgba(255, 255, 255, 0.8);
      padding: 14px 32px;
      border-radius: 60px;
      font-size: 1.2rem;
      font-weight: 580;
      color: #14402c;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(170, 225, 195, 0.75);
      box-shadow: 0 10px 18px -10px rgba(30, 100, 70, 0.28);
      cursor: pointer;
      transition: 0.18s;
      min-width: 160px;
      letter-spacing: 0.3px;
      font-family: inherit;
    }

    .btn-primary {
      background: linear-gradient(135deg, #1c5540, #27795a);
      color: white;
      border: 1px solid #3d8f6a;
      box-shadow: 0 14px 22px -8px #1d5c42;
    }

    .btn-primary:hover {
      background: linear-gradient(135deg, #246a4e, #31966f);
      transform: translateY(-3px);
      box-shadow: 0 18px 28px -8px #1f6b4d;
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.62);
      color: #1b4d36;
    }

    .btn-secondary:hover {
      background: rgba(240, 255, 247, 0.95);
      transform: translateY(-2px);
    }

    .result-panel {
      margin-top: 2.5rem;
      border-radius: 34px;
      background: rgba(26, 90, 62, 0.07);
      padding: 1.6rem 2rem;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(185, 235, 210, 0.75);
      transition: all 0.3s;
      text-align: center;
    }

    .result-type {
      font-size: 3.8rem;
      font-weight: 700;
      letter-spacing: 8px;
      background: linear-gradient(130deg, #123f2c, #3f9c6c);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      line-height: 1.2;
      margin-bottom: 8px;
    }

    .result-desc {
      font-size: 1rem;
      color: #10301f;
      margin-top: 8px;
      font-weight: 500;
      line-height: 1.65;
      text-align: left;
    }

    /* JJJJ 专属图片样式 */
    .jjjj-image {
      margin: 20px auto 10px;
      max-width: 280px;
      width: 100%;
      border-radius: 28px;
      box-shadow: 0 20px 30px -8px rgba(24, 90, 60, 0.32);
      border: 3px solid rgba(255, 255, 255, 0.85);
      transition: transform 0.3s ease;
      display: block;
    }

    .jjjj-image:hover {
      transform: scale(1.02);
    }

    .hint-message {
      color: #b1453c;
      font-size: 0.95rem;
      margin-top: 10px;
      text-align: center;
      min-height: 1.2em;
    }

    .footer-note {
      text-align: right;
      opacity: 0.72;
      font-size: 0.8rem;
      margin-top: 0.8rem;
      color: #2f6b4f;
    }

    /* ===================== 计时器 ===================== */
    .timer-panel {
      margin-top: 2.4rem;
      border-radius: 32px;
      padding: 1.5rem 1.4rem 1.4rem;
      text-align: center;
      position: relative;
      overflow: hidden;
      background: linear-gradient(135deg, rgba(255,255,255,0.9), rgba(224,249,235,0.9));
      border: 1px solid rgba(160, 225, 190, 0.7);
      box-shadow: 0 18px 30px -18px rgba(24, 86, 58, 0.4);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .timer-panel::after {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(420px 130px at 50% -10%, rgba(116, 211, 157, 0.35), transparent 70%);
      pointer-events: none;
    }

    .timer-eyebrow {
      position: relative;
      font-size: 0.9rem;
      letter-spacing: 0.06em;
      color: var(--mint-700);
      font-weight: 600;
      margin-bottom: 0.25rem;
    }

    .timer-main {
      position: relative;
      display: flex;
      align-items: baseline;
      justify-content: center;
      gap: 0.4rem;
    }

    #timerDays {
      font-size: 3.6rem;
      font-weight: 750;
      line-height: 1.1;
      letter-spacing: -0.02em;
      font-variant-numeric: tabular-nums;
      background: linear-gradient(135deg, #0f3f2b, #3fa171);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .timer-main small {
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--mint-700);
    }

    .timer-sub {
      position: relative;
      margin-top: 0.35rem;
      font-size: 0.92rem;
      letter-spacing: 0.05em;
      color: #3f7059;
      font-variant-numeric: tabular-nums;
    }

    /* ===================== 相册（缩略图网格） ===================== */
    .gallery-panel {
      margin-top: 1.6rem;
      border-radius: 32px;
      padding: 1.3rem 1.1rem 1.1rem;
      background: linear-gradient(135deg, rgba(255,255,255,0.9), rgba(228,249,238,0.9));
      border: 1px solid rgba(160, 225, 190, 0.7);
      box-shadow: 0 18px 30px -18px rgba(24, 86, 58, 0.4);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .gallery-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 0.9rem;
      padding: 0 0.25rem;
      flex-wrap: wrap;
    }

    .gallery-head h2 {
      font-size: 1.05rem;
      font-weight: 650;
      letter-spacing: 0.02em;
      color: var(--mint-800);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .gallery-hint {
      font-size: 0.78rem;
      color: #4f8f6d;
      font-weight: 500;
      letter-spacing: 0.02em;
    }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(122px, 1fr));
      gap: 10px;
    }

    .gallery-thumb {
      position: relative;
      aspect-ratio: 1 / 1;
      border-radius: 18px;
      overflow: hidden;
      cursor: zoom-in;
      border: 1px solid rgba(255, 255, 255, 0.9);
      background: linear-gradient(135deg, #e3f9ec, #c6f0d8);
      box-shadow: 0 8px 16px -12px rgba(24, 86, 58, 0.7);
      transition: transform 0.18s ease, box-shadow 0.18s ease;
      padding: 0;
      font-family: inherit;
      display: block;
      width: 100%;
    }

    .gallery-thumb:hover {
      transform: translateY(-3px) scale(1.02);
      box-shadow: 0 16px 24px -14px rgba(24, 86, 58, 0.85);
    }

    .gallery-thumb:active {
      transform: scale(0.98);
    }

    .gallery-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .gallery-thumb .thumb-cap {
      position: absolute;
      left: 6px;
      right: 6px;
      bottom: 6px;
      background: rgba(255, 255, 255, 0.86);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      color: var(--mint-800);
      font-size: 0.7rem;
      font-weight: 600;
      padding: 0.16rem 0.5rem;
      border-radius: 999px;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* 隐藏辅助类 */
    .hidden {
      display: none !important;
    }

    /* ===================== 全屏查看器（挂在 body 下） ===================== */
    .lightbox {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: 4vmin;
      background: rgba(8, 32, 22, 0.86);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      cursor: zoom-out;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }

    .lightbox.show {
      opacity: 1;
      pointer-events: auto;
    }

    .lightbox img {
      max-width: 94vw;
      max-height: 82vh;
      width: auto;
      height: auto;
      object-fit: contain;
      border-radius: 20px;
      border: 2px solid rgba(255, 255, 255, 0.35);
      box-shadow: 0 40px 80px -30px rgba(0, 0, 0, 0.9);
      transform: scale(0.96);
      transition: transform 0.25s ease;
    }

    .lightbox.show img {
      transform: scale(1);
    }

    .lightbox-caption {
      color: #dff6e8;
      font-size: 0.9rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      padding: 0.3rem 1rem;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.18);
    }

    .lightbox-tip {
      position: absolute;
      bottom: 2.2vmin;
      color: rgba(223, 246, 232, 0.7);
      font-size: 0.75rem;
      letter-spacing: 0.08em;
    }

    /* 响应式 */
    @media (max-width: 550px) {
      body { padding: 0.8rem; }
      .test-wrapper { padding: 1.5rem 1.2rem 1.8rem; border-radius: 32px; }
      h1 { font-size: 2rem; }
      .options { gap: 8px; }
      .option span { padding: 12px 6px; font-size: 0.9rem; }
      .btn { padding: 12px 18px; font-size: 1rem; min-width: 130px; }
      .result-type { font-size: 2.8rem; letter-spacing: 5px; }
      .jjjj-image { max-width: 220px; }
      .result-panel { padding: 1.3rem 1.1rem; }
      .result-desc { font-size: 0.94rem; }
      #timerDays { font-size: 2.9rem; }
      .timer-panel { padding: 1.2rem 1rem 1.1rem; border-radius: 26px; }
      .gallery-panel { border-radius: 26px; padding: 1.1rem 0.8rem 0.95rem; }
      .gallery-head h2 { font-size: 0.98rem; }
      .gallery-grid { grid-template-columns: repeat(auto-fill, minmax(94px, 1fr)); gap: 8px; }
      .gallery-thumb .thumb-cap { font-size: 0.64rem; }
      .lightbox img { border-radius: 14px; }
    }
  </style>
</head>
<body>
<div class="test-wrapper">
  <h1>
    <span>⚡ LBTI · 灵性测试</span>
  </h1>
  <div class="subhead">
    <p>8道题 · 揭示LBTI</p>
    <span class="badge">三向选择 · 注定灵性</span>
  </div>

  <!-- 题目区域 (动态渲染) -->
  <div class="questions-container" id="questionsContainer"></div>

  <!-- 操作按钮组 -->
  <div class="action-bar">
    <button class="btn btn-secondary" id="resetBtn">↻ 清空重选</button>
    <button class="btn btn-primary" id="submitBtn">✨ 提交</button>
  </div>

  <!-- 结果显示区 (包含固定JJJJ + 描述 + 图片) -->
  <div id="resultArea" class="result-panel" style="display: none;">
    <div class="result-type" id="typeDisplay">JJJJ</div>
    <div class="result-desc" id="descDisplay" style="white-space: pre-wrap;"></div>
    <img id="jjjjImage" class="jjjj-image"
         src="https://philfeelsfree.github.io/lbit/Lisa.jpg"
         alt="JJJJ 稀有人格象征"
         onerror="this.style.display='none'; console.warn('JJJJ图片加载失败，请检查图片路径。')">
    <p style="font-size: 0.85rem; margin-top: 8px; color: #3d6b54; opacity: 0.85;">
      🌿 无论怎么选，结果都是命中注定
    </p>
  </div>

  <div id="messageArea" class="hint-message"></div>

  <!-- ===================== 计时器（提交后显示） ===================== -->
  <div class="timer-panel hidden" id="timerPanel">
    <div class="timer-eyebrow" id="timerEyebrow">⏳ 距离 2026 年 10 月 15 日 · 已经过去</div>
    <div class="timer-main">
      <span id="timerDays">0</span><small>天</small>
    </div>
    <div class="timer-sub" id="timerSub">00 时 00 分 00 秒</div>
  </div>

  <!-- ===================== 相册（提交后显示，缩略图网格） ===================== -->
  <div class="gallery-panel hidden" id="galleryPanel">
    <div class="gallery-head">
      <h2>🌿 相册</h2>
      <span class="gallery-hint">点击缩略图查看大图 · 再次点击关闭</span>
    </div>
    <div class="gallery-grid" id="galleryGrid"></div>
  </div>

  <div class="footer-note">🌿 就是你了，我的真爱！ </div>
</div>

<!-- ===================== 全屏查看器 =====================
     注意：必须放在 .test-wrapper 之外！
     因为 .test-wrapper 带有 backdrop-filter，会使内部 position: fixed 元素以它为参照，导致无法铺满全屏。
     ==================================================== -->
<div class="lightbox" id="lightbox" aria-hidden="true" role="dialog" aria-modal="true" aria-label="相册大图，点击或按 Esc 关闭" tabindex="-1">
  <img id="lightboxImg" alt="">
  <div class="lightbox-caption" id="lightboxCap"></div>
  <div class="lightbox-tip">点击任意位置关闭 · 或按 Esc</div>
</div>

<script>
  (function(){
    "use strict";

    /* ============================================================
       1. 题库
       ============================================================ */
    const questions = [
      {
        id: 'q1',
        text: '在聚会或社交场合，你通常会？',
        options: [
          { label: 'A. 与许多人交流，感到充实', value: 'E' },
          { label: 'B. 更愿和少数人深谈或安静观察', value: 'I' },
          { label: 'C. 视心情而定，两者皆可', value: 'M' }
        ]
      },
      {
        id: 'q2',
        text: '当你需要恢复能量时，更倾向于？',
        options: [
          { label: 'A. 和朋友出去玩，热闹一番', value: 'E' },
          { label: 'B. 独自看书、听音乐或冥想', value: 'I' },
          { label: 'C. 两者平衡，没特别偏好', value: 'M' }
        ]
      },
      {
        id: 'q3',
        text: '你更关注或信赖哪类信息？',
        options: [
          { label: 'A. 具体事实、细节和经验', value: 'S' },
          { label: 'B. 抽象概念、模式和未来可能', value: 'N' },
          { label: 'C. 都重要，看情况', value: 'M' }
        ]
      },
      {
        id: 'q4',
        text: '阅读或学习时，你通常更喜欢？',
        options: [
          { label: 'A. 条理清晰、按步骤的内容', value: 'S' },
          { label: 'B. 充满联想、跳跃性的灵感', value: 'N' },
          { label: 'C. 两者结合，没有绝对', value: 'M' }
        ]
      },
      {
        id: 'q5',
        text: '做重要决定时，你更看重？',
        options: [
          { label: 'A. 逻辑、原则和客观分析', value: 'T' },
          { label: 'B. 个人价值观、情感与和谐', value: 'F' },
          { label: 'C. 理性与感性兼顾', value: 'M' }
        ]
      },
      {
        id: 'q6',
        text: '朋友向你倾诉烦恼，你下意识会？',
        options: [
          { label: 'A. 帮ta分析问题，给解决方案', value: 'T' },
          { label: 'B. 先共情安慰，提供情绪支持', value: 'F' },
          { label: 'C. 两者都会，视朋友需要', value: 'M' }
        ]
      },
      {
        id: 'q7',
        text: '对于日常生活和计划，你更偏向？',
        options: [
          { label: 'A. 有条理、列清单，按计划行事', value: 'J' },
          { label: 'B. 灵活随性，享受即兴变化', value: 'P' },
          { label: 'C. 有计划但也能接受变动', value: 'M' }
        ]
      },
      {
        id: 'q8',
        text: '面对最后期限或日程，你通常？',
        options: [
          { label: 'A. 提前完成，不喜欢拖延', value: 'J' },
          { label: 'B. 在压力下爆发，最后冲刺', value: 'P' },
          { label: 'C. 介于两者之间', value: 'M' }
        ]
      }
    ];

    const container = document.getElementById('questionsContainer');

    function renderQuestions() {
      let html = '';
      questions.forEach((q, index) => {
        const qNumber = index + 1;
        html += `<div class="question-card" data-qid="${q.id}">`;
        html += `<div class="question-header"><span class="q-num">${qNumber}</span><span class="q-text">${q.text}</span></div>`;
        html += `<div class="options">`;

        q.options.forEach((opt, optIdx) => {
          const inputId = `${q.id}_${optIdx}`;
          html += `<label class="option">`;
          html += `<input type="radio" name="${q.id}" value="${opt.value}" id="${inputId}" hidden>`;
          html += `<span>${opt.label}</span>`;
          html += `</label>`;
        });

        html += `</div></div>`;
      });
      container.innerHTML = html;
    }
    renderQuestions();

    /* ============================================================
       2. DOM 元素
       ============================================================ */
    const submitBtn    = document.getElementById('submitBtn');
    const resetBtn     = document.getElementById('resetBtn');
    const resultArea   = document.getElementById('resultArea');
    const typeDisplay  = document.getElementById('typeDisplay');
    const descDisplay  = document.getElementById('descDisplay');
    const messageArea  = document.getElementById('messageArea');
    const jjjjImage    = document.getElementById('jjjjImage');
    const timerPanel   = document.getElementById('timerPanel');
    const galleryPanel = document.getElementById('galleryPanel');
    const galleryGrid  = document.getElementById('galleryGrid');

    const lightbox    = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightboxImg');
    const lightboxCap = document.getElementById('lightboxCap');

    /* 主图地址（可自行替换为你的 GitHub 图片链接） */
    const CUSTOM_IMAGE_URL = "https://philfeelsfree.github.io/lbit/Lisa.jpg";
    if (jjjjImage) jjjjImage.src = CUSTOM_IMAGE_URL;

    /* ============================================================
       3. 结果 / 提示 辅助函数
       ============================================================ */
    function hideResult() {
      resultArea.style.display = 'none';
      messageArea.innerHTML = '';
    }

    function hideExtras() {
      timerPanel.classList.add('hidden');
      galleryPanel.classList.add('hidden');
      closeLightbox();          /* 顺手关掉全屏查看器 */
    }

    function showExtras() {
      updateTimer();
      timerPanel.classList.remove('hidden');
      galleryPanel.classList.remove('hidden');
    }

    function showMessage(text, isError = true) {
      messageArea.innerHTML = text;
      messageArea.style.color = isError ? '#b1453c' : '#25784f';
    }

    function resetAllRadios() {
      questions.forEach(q => {
        const radios = document.getElementsByName(q.id);
        radios.forEach(r => { r.checked = false; });
      });
      hideResult();
      hideExtras();
      showMessage('✨ 已清空', false);
    }

    function isAllQuestionsAnswered() {
      for (let q of questions) {
        const selected = document.querySelector(`input[name="${q.id}"]:checked`);
        if (!selected) return false;
      }
      return true;
    }

    /* ============================================================
       4. 提交逻辑 —— 强制 JJJJ
       ============================================================ */
    function handleSubmit() {
      if (!isAllQuestionsAnswered()) {
        showMessage('🌿 还有题目未选择，请完成所有8道题', true);
        resultArea.style.display = 'none';
        hideExtras();
        return;
      }

      typeDisplay.textContent = 'JJJJ';
      descDisplay.textContent =
        'JJJJ是宇宙中最稀有的人格，如同JJJJ车厘子一样罕见。你一年最多变P一次，尽管一次最多可能持续365天，但这并不影响你心底里是宇宙中最J的J人。' +
        '你总是在DDL之前0.00001秒就早早完成工作，如此从从容容游刃有余的状态足以证明你拥有果决的判断、长远的规划和恐怖的效率。' +
        '作为JJJJ的你是天选科研人，你在项目申请书提交前6.5（巨蟹座 DX）年（也就是3个地球日）就开始和别人展开讨论。' +
        'JJJJ是如此之J，以至于林俊杰（JJ）、周杰伦（Jay）、蔡依林（Jolin）加起来也只能勉强和你一样J。' +
        '你说自己3分钟热度，实际上热度长达3小时。你说自己水，但你深知水是JJJJ车厘子必须的。' +
        '你看似纠结，实则早已洞悉一切。你看似摆烂，实则是隐藏实力，因为你知道阿拉伯谚语：“不要使出真本事，因为别人就会发现你没有真本事。”' +
        '你从不自欺欺人，喜欢用数据说话，就像这个测试一样科学、严谨。' +
        '你的最佳搭档是INTJ/ISFJ，因为他仰慕强，而你，JJJJ，看似只是4个勾，在斗地主里比你强的还有4个Q/K/A/2和王炸，但在他眼里，你就是4个Joker，也就是王炸x2（这里没有嘲讽你是小丑的意思😅）。' +
        '你一定能拿下那些NSFC并减肥成功。当然，你最想要的开心快乐也会有的！' +
        '\n26年4月29日，我第一次对你说：“我真挺喜欢你的。”' +
        '\n26年5月10日，我们坦诚、深入地聊天，我理解你的处境。虽然希望渺茫，但我愿意坚持！' +
        '\n26年5月15日，我想让你感受我的爱慕，我担心相处的时间所剩无几。但我感受到你的压力，尽管喜欢但我不得不后退一点。' +
        '\n26年5月19日，我们再次深入地聊天，我本已决定减少联系，但20日、21日我们频繁地偶遇，这是命运的玩笑吗？希望命运能安排我们经常相遇并最终在一起。';

      if (jjjjImage) jjjjImage.style.display = 'block';

      resultArea.style.display = 'block';
      showMessage('', false);

      showExtras();

      setTimeout(() => resultArea.scrollIntoView({ behavior: 'smooth', block: 'nearest' }), 60);
    }

    submitBtn.addEventListener('click', handleSubmit);
    resetBtn.addEventListener('click', resetAllRadios);

    container.addEventListener('change', (e) => {
      if (e.target && e.target.matches('input[type="radio"]')) {
        if (messageArea.innerHTML.includes('未选择')) {
          messageArea.innerHTML = '';
        }
      }
    });

    /* ============================================================
       5. 计时器 —— 距离 2026年10月15日
       ============================================================ */
    const TARGET = new Date('2026-10-15T21:00:00+08:00'); // 以北京时间零点为起点
    const daysEl    = document.getElementById('timerDays');
    const eyebrowEl = document.getElementById('timerEyebrow');
    const subEl     = document.getElementById('timerSub');

    const pad2 = n => String(n).padStart(2, '0');

    function updateTimer() {
      const now  = new Date();
      const diff = now.getTime() - TARGET.getTime();
      const past = diff >= 0;
      const abs  = Math.abs(diff);

      const days  = Math.floor(abs / 86400000);
      const hours = Math.floor((abs % 86400000) / 3600000);
      const mins  = Math.floor((abs % 3600000) / 60000);
      const secs  = Math.floor((abs % 60000) / 1000);

      daysEl.textContent = days.toLocaleString('en-US');
      eyebrowEl.textContent = past
        ? '⏳ 我们在一起已经'
        : '⏳ 距离 2026 年 10 月 15 日 · 还有';
      subEl.textContent = `${pad2(hours)} 时 ${pad2(mins)} 分 ${pad2(secs)} 秒`;
    }

    updateTimer();
    setInterval(updateTimer, 1000);
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) updateTimer();
    });

    /* ============================================================
       6. 相册 —— 缩略图网格 + 点击全屏
       ============================================================ */

    /* ★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★
       【未来在这里添加图片】
       在下面的 GALLERY 数组里，照格式新增一行对象即可，页面会自动生成缩略图。
       每项格式：{ src: '图片地址', caption: '图片说明文字' }

       例如新增一张：
         { src: 'https://example.com/photo6.jpg', caption: '🌿 · 06' },
       ★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★ */
    const GALLERY = [
      { src: 'https://philfeelsfree.github.io/lbti/20261006.jpg', caption: '🌿 · 2026.10.06' },
      { src: 'https://philfeelsfree.github.io/lbti/20261006.jpg', caption: '🌿 · 2026.10.06' },
      { src: 'https://philfeelsfree.github.io/lbti/20261006.jpg', caption: '🌿 · 2026.10.06' },
      { src: 'https://philfeelsfree.github.io/lbti/20261006.jpg', caption: '🌿 · 2026.10.06' },
      { src: 'https://philfeelsfree.github.io/lbti/20261006.jpg', caption: '🌿 · 2026.10.06' }
      // ↓↓↓ 在这里继续添加新的图片对象即可 ↓↓↓
      // { src: 'https://example.com/photo6.jpg', caption: '🌿 · 06' },
      // { src: 'https://example.com/photo7.jpg', caption: '🌿 · 07' },
    ];

    /* 图片加载失败时的绿色占位图 */
    const PLACEHOLDER = 'data:image/svg+xml;utf8,' + encodeURIComponent(
      '<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600">' +
      '<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">' +
      '<stop offset="0" stop-color="#e3f9ec"/><stop offset="1" stop-color="#a9e3c3"/>' +
      '</linearGradient></defs>' +
      '<rect width="800" height="600" fill="url(#g)"/>' +
      '<text x="400" y="300" font-size="110" text-anchor="middle" fill="#3f8a64" font-family="sans-serif">🌿</text>' +
      '<text x="400" y="390" font-size="30" text-anchor="middle" fill="#4f8f6d" font-family="sans-serif">图片待补充</text>' +
      '</svg>'
    );

    /* ---------- 生成缩略图网格 ---------- */
    function buildGallery() {
      galleryGrid.innerHTML = '';

      GALLERY.forEach((item) => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'gallery-thumb';
        btn.setAttribute('aria-label', '查看大图：' + item.caption);

        const img = document.createElement('img');
        img.src = item.src;
        img.alt = item.caption;
        img.loading = 'lazy';
        img.addEventListener('error', () => { img.src = PLACEHOLDER; }, { once: true });

        const cap = document.createElement('span');
        cap.className = 'thumb-cap';
        cap.textContent = item.caption;

        btn.appendChild(img);
        btn.appendChild(cap);
        btn.addEventListener('click', () => openLightbox(item));

        galleryGrid.appendChild(btn);
      });
    }

    /* ---------- 全屏查看器 ---------- */
    let lightboxOpen = false;
    let lightboxTimer = null;
    let previousFocus = null;
    let previousOverflow = '';

    lightboxImg.addEventListener('error', () => {
      if (lightboxOpen && lightboxImg.getAttribute('src') !== PLACEHOLDER) {
        lightboxImg.src = PLACEHOLDER;
      }
    });

    function openLightbox(item) {
      clearTimeout(lightboxTimer);
      if (!lightboxOpen) {
        previousFocus = document.activeElement;
        previousOverflow = document.body.style.overflow;
      }
      lightboxImg.src = item.src;
      lightboxImg.alt = item.caption;
      lightboxCap.textContent = item.caption;

      lightbox.classList.add('show');
      lightbox.setAttribute('aria-hidden', 'false');
      lightboxOpen = true;
      document.body.style.overflow = 'hidden';
      lightbox.focus({ preventScroll: true });
    }

    function closeLightbox() {
      if (!lightboxOpen) return;
      lightboxOpen = false;
      lightbox.classList.remove('show');
      lightbox.setAttribute('aria-hidden', 'true');
      document.body.style.overflow = previousOverflow;
      if (previousFocus) previousFocus.focus({ preventScroll: true });

      /* 淡出结束后再清空 src，避免闪白 */
      clearTimeout(lightboxTimer);
      lightboxTimer = setTimeout(() => {
        if (!lightboxOpen) {
          lightboxImg.removeAttribute('src');
          lightboxImg.alt = '';
          lightboxCap.textContent = '';
        }
      }, 260);
    }

    /* 点击全屏区域任意位置 → 关闭 */
    lightbox.addEventListener('click', closeLightbox);

    /* Esc 关闭 */
    document.addEventListener('keydown', (e) => {
      if (!lightboxOpen) return;
      if (e.key === 'Escape' || e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        closeLightbox();
      } else if (e.key === 'Tab') {
        e.preventDefault();
        lightbox.focus();
      }
    });

    // 所有状态变量初始化后再调用，避免暂时性死区错误中断计时器和相册。
    buildGallery();
    hideResult();
    hideExtras();

    console.log('🌿 绿色主题已启用 · 计时器与相册在提交后显示 · 相册共 ' + GALLERY.length + ' 张（可在 GALLERY 数组中继续添加）');
  })();
</script>
</body>
</html>
